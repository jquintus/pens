media:
  input: assets
  output: /assets
  rename: safe
  extensions: [svg, png, jpg, jpeg, webp, avif]

components:
  nose_cone:
    type: object
    label: Nose Cone (mm)
    fields:
      - name: cylinder_height
        type: number
        required: true
      - name: cylinder_outside_diameter
        type: number
        required: true
      - name: frustum_height
        type: number
        required: true
      - name: frustum_top_diameter
        type: number
        required: true
      - name: frustum_bottom_diameter
        type: number
        required: true
      - name: top_hole_diameter
        type: number
        required: true
      - name: bottom_hole_diameter
        type: number
        required: true
      - name: top_hole_height
        type: number
        required: true

content:
  - name: configurations
    label: Pen configurations
    type: collection
    path: configurations
    format: yaml
    exclude:
      - README.md
    view:
      primary: id
      sort: id
    filename: "{primary}.yml"
    fields:
      - name: id
        type: string
        required: true
        label: ID (slug; also used as the default output basename)
        pattern: "^[a-z0-9_-]+$"
      - name: title
        type: string
        required: true
      - name: description
        type: text
        label: Short description
      - name: nose_cone
        component: nose_cone
      - name: refill
        type: reference
        label: Refill
        options:
          collection: refills
          value: "{primary}"
          label: "{brand} {model}"
      - name: openscad
        type: object
        label: OpenSCAD-only geometry (mm)
        fields:
          - name: refill_tip_projection_mm
            type: number
            label: Refill tip projection beyond nose (assembly view)
          - name: refill_tip_clearance_mm
            type: number
            label: Added diameter clearance at tip bore
          - name: refill_passage_clearance_mm
            type: number
            label: Added diameter clearance in passage
          - name: nose_cone
            type: object
            fields:
              - name: visible_length_mm
                type: number
              - name: insertion_length_mm
                type: number
              - name: insertion_diameter_mm
                type: number
              - name: base_diameter_mm
                type: number
              - name: tip_diameter_mm
                type: number
              - name: round_radius_mm
                type: number
              - name: bore_segments
                type: object
                list: true
                label: Bore profile from nose tip to rear
                description: End distances are measured from the nose tip. The last end must equal visible plus insertion length.
                fields:
                  - name: kind
                    type: select
                    required: true
                    options:
                      values: [cylinder, taper]
                  - name: diameter_mm
                    type: number
                  - name: diameter_start_mm
                    type: number
                  - name: diameter_end_mm
                    type: number
                  - name: end_distance_mm
                    type: number
          - name: end_cap
            type: object
            fields:
              - name: length_mm
                type: number
              - name: diameter_mm
                type: number
              - name: tip_diameter_mm
                type: number
              - name: insertion_length_mm
                type: number
              - name: insertion_diameter_mm
                type: number
              - name: round_radius_mm
                type: number
      - name: slicing_profiles
        label: Slicing Profiles
        type: select
        options:
          multiple: true
          values:
            - 0.2_fast
            - 0.2_quality
            - 0.4_fast
            - 0.4_quality
            - 0.6_fast
            - 0.6_quality
      - name: gallery
        label: Gallery images
        type: image
        options:
          multiple:
            max: 8
          extensions: [svg, png, jpg, jpeg, webp, avif]

  - name: refills
    label: Refill catalog
    type: collection
    path: refills
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: id
      sort: id
    fields:
      - name: id
        type: string
        required: true
        pattern: "^[a-z0-9_-]+$"
      - name: brand
        type: string
        required: true
      - name: model
        type: string
        required: true
      - name: format
        type: select
        required: true
        label: Physical format / family
        options:
          values: [unknown, parker-g2, pilot-g2, d1, euro, proprietary, other]
      - name: ink_type
        type: select
        options:
          values: [unknown, gel, ballpoint, rollerball, hybrid, fountain, felt-tip, other]
      - name: tip_size_mm
        type: number
      - name: tip_shape
        type: select
        label: Tip type
        options:
          values: [unknown, needle, conical, ballpoint, fineliner, felt, other]
      - name: measurement_status
        type: select
        required: true
        options:
          values: [measured, approximate, incomplete]
      - name: measurement_notes
        type: text
      - name: segments
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{kind} to {end_distance_mm} mm"
        label: Axial segments, tip to rear
        description: Each end distance is measured from the writing tip, not from the previous segment.
        fields:
          - name: kind
            type: select
            required: true
            options:
              values: [cylinder, taper]
          - name: diameter_mm
            type: number
            label: Cylinder diameter (mm)
          - name: diameter_start_mm
            type: number
            label: Taper diameter at segment start (mm)
          - name: diameter_end_mm
            type: number
            label: Taper diameter at segment end (mm)
          - name: end_distance_mm
            type: number
            label: Distance from writing tip to segment end (mm)
          - name: measurement_status
            type: select
            options:
              values: [measured, approximate, incomplete]
          - name: notes
            type: text
      - name: colors
        type: string
        list: true
      - name: variants
        type: object
        list: true
        fields:
          - name: color
            type: string
          - name: sku
            type: string
          - name: url
            type: string
          - name: notes
            type: text
      - name: rating
        type: number
        label: Personal rating (1–5 stars)
      - name: notes
        type: text
        label: Personal notes
      - name: ink_notes
        type: text
        label: Ink performance and writing notes
      - name: pen_photos
        type: image
        label: Photos of source pen
        options:
          multiple: true
          extensions: [svg, png, jpg, jpeg, webp, avif]
      - name: ink_photos
        type: image
        label: Photos of ink and writing samples
        options:
          multiple: true
          extensions: [svg, png, jpg, jpeg, webp, avif]
      - name: photos
        type: image
        label: Other photos (legacy)
        options:
          multiple: true
          extensions: [svg, png, jpg, jpeg, webp, avif]
      - name: links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: url
            type: string

  - name: models
    label: Custom models
    type: collection
    path: models
    format: yaml
    view:
      primary: id
      sort: id
    filename: "{actual_slug}/config.yml"
    fields:
      - name: id
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: description
        type: text
      - name: slicing_profiles
        label: Slicing Profiles
        type: select
        options:
          multiple: true
          values:
            - 0.2_fast
            - 0.2_quality
            - 0.4_fast
            - 0.4_quality
            - 0.6_fast
            - 0.6_quality
      - name: gallery
        label: Gallery images
        type: image
        options:
          multiple:
            max: 8
          extensions: [svg, png, jpg, jpeg, webp, avif]
