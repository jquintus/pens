name: Validate OpenSCAD gallery

on:
  pull_request:
  push:
    branches: ['jq/openscad-gallery']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          pip install pyyaml trimesh numpy cadquery
      - name: Build every configured model and gallery page
        run: |
          xvfb-run -a python scripts/build_openscad.py
          python scripts/generate_openscad_site.py
      - name: Validate geometry, configuration errors, and gallery links
        run: python -m unittest discover -s tests -v
