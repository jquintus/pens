name: Create Release

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Release notes"
        required: false
        default: ""

jobs:
  release-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          latest=$(git tag --sort=-v:refname | head -n 1)
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Bump version
        id: version
        run: |
          latest=${{ steps.tag.outputs.latest }}

          if [ -z "$latest" ]; then
            new=v1.0.0
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi

          echo "new=$new" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.new }}
          git push origin ${{ steps.version.outputs.new }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 openscad xvfb

      - name: Install Python deps
        run: |
          pip install cadquery pyyaml

      - name: Run build
        env:
          PENS_RELEASE_VERSION: ${{ steps.version.outputs.new }}
        run: |
          python scripts/build.py
          xvfb-run -a python scripts/build_openscad.py
          python -m zipfile -c outputs/openscad-models.zip outputs/openscad

      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new }}
          name: ${{ steps.version.outputs.new }}
          body: ${{ github.event.inputs.description }}
          files: |
            outputs/*.step
            outputs/*.stl
            outputs/*.gcode
            outputs/openscad-models.zip
