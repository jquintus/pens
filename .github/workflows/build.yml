name: Build CAD on Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 openscad xvfb

      - name: Install Python deps
        run: |
          pip install cadquery pyyaml

      - name: Run build
        env:
          PENS_RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          python scripts/build.py
          xvfb-run -a python scripts/build_openscad.py
          python -m zipfile -c outputs/openscad-models.zip outputs/openscad

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            outputs/*.step
            outputs/*.stl
            outputs/*.gcode
            outputs/openscad-models.zip
